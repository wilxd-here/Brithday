<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>willMovies X xaerisoft</title>

  <!-- Font & FontAwesome Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #070a12;
      --bg-card: #0f172a;
      --bg-card-hover: #1e293b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Glassmorphism */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 10, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .search-container {
      position: relative;
      width: 300px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-container input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-container i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Hero Banner Section */
    .hero {
      position: relative;
      margin: 20px 5%;
      min-height: 280px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #1e1b4b, #0f172a, #070a12);
      display: flex;
      align-items: center;
      padding: 40px;
      border: 1px solid var(--border);
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Filter Bar */
    .filter-bar {
      padding: 0 5%;
      margin: 15px 0 10px 0;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .section-title {
      padding: 10px 5% 0 5%;
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Grid Film Modern */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      padding: 20px 5%;
    }

    .movie-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      overflow: hidden;
      background: #121824;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .movie-card:hover .poster-wrapper img {
      transform: scale(1.06);
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    /* Modal Player Streaming */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .iframe-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .server-selector {
      padding: 15px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--bg-main);
    }

    .server-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .server-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Footer */
    footer {
      margin-top: auto;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 25px 5%;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .hero { padding: 25px; }
      .hero h1 { font-size: 1.5rem; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .search-container { width: 170px; }
    }
  </style>
</head>
<body>

  <!-- Header & Nav -->
  <nav class="navbar">
    <a href="/" class="brand">will<span>Movies</span></a>
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Cari film favorit...">
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <span class="badge">willMovies Exclusive</span>
      <h1 id="hero-title">Nonton Film Gratis Tanpa Batas</h1>
      <p id="hero-desc">Saksikan ribuan film dan series populer dalam kualitas tinggi secara gratis.</p>
    </div>
  </section>

  <!-- Filter Menu -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="home">Film Terbaru</button>
    <button class="filter-btn" data-filter="rating">Rating Terbaik</button>
  </div>

  <h2 class="section-title" id="section-heading">Rekomendasi Utama</h2>

  <!-- Container Grid Film (Tempat app.js merender film) -->
  <main class="movie-grid" id="movie-container">
    <!-- Konten film diisi otomatis dari app.js -->
  </main>

  <!-- Streaming Player Modal -->
  <div class="modal" id="player-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-movie-title">Memuat Pemutar...</h3>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <div class="iframe-container">
        <iframe id="player-iframe" src="" allowfullscreen></iframe>
      </div>
      <div class="server-selector" id="server-list">
        <!-- Daftar tombol server streaming -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 <strong>willMovies</strong>. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
