<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Willmovies</title>

  <!-- Font & FontAwesome Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Tema Biru Hitam */
      --bg-main: #020617; /* Hitam kebiruan pekat */
      --bg-surface: #0f172a; /* Biru dongker gelap */
      --bg-surface-hover: #1e293b;
      --primary: #3b82f6; /* Biru terang (aksen) */
      --primary-glow: rgba(59, 130, 246, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    /* Top App Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(2,6,23,0.95) 0%, rgba(2,6,23,0) 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand i { color: var(--primary); font-size: 1.1rem; }
    
    .top-actions {
      display: flex;
      gap: 15px;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* Hero Banner (Diisi oleh JS) */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 400px;
      margin-top: -70px;
      background-color: var(--bg-surface);
      background-size: cover;
      background-position: top center;
      transition: background-image 0.5s ease-in-out;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-main) 0%, rgba(2,6,23,0.4) 50%, rgba(2,6,23,0.8) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .badge-series {
      align-self: flex-start;
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 10px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .hero-meta i { color: var(--primary); }

    .hero-buttons { display: flex; gap: 12px; }

    .btn-tonton {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-detail {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Header Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px 20px;
    }

    .section-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
    .section-title span { display: block; font-size: 1.3rem; font-weight: 800; color: var(--text-main); text-transform: none; margin-top: 5px; }
    .see-all { color: var(--primary); font-size: 0.9rem; text-decoration: none; font-weight: 600; }

    /* Grid Film (Diisi oleh JS) */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
      padding: 10px 20px;
    }

    .movie-card {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .movie-card:active { transform: scale(0.95); }

    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--bg-surface);
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .rating-badge {
      position: absolute;
      bottom: 60px;
      left: 8px;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .rating-badge i { color: var(--primary); font-size: 0.7rem; }

    .card-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-year { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* Navigasi Bawah */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--bg-surface);
      display: flex;
      justify-content: space-around;
      padding: 10px 10px 20px 10px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      width: 60px;
      transition: color 0.2s;
    }

    .nav-item i { font-size: 1.4rem; padding: 10px; border-radius: 50%; transition: all 0.3s; }
    .nav-item.active { color: var(--text-main); }
    .nav-item.active i { background: var(--primary); color: #fff; transform: translateY(-5px); box-shadow: 0 4px 15px var(--primary-glow); }

  </style>
</head>
<body>

  <!-- Header -->
  <header class="top-bar">
    <a href="/" class="brand">
      <i class="fa-solid fa-play"></i> Willmovies
    </a>
    <div class="top-actions">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-banner" id="hero-banner">
    <div class="hero-overlay">
      <span class="badge-series" id="hero-badge">TRENDING</span>
      <h1 class="hero-title" id="hero-title">Memuat...</h1>
      <div class="hero-meta" id="hero-meta">
        <span><i class="fa-solid fa-star"></i> -.-</span>
        <span>----</span>
      </div>
      <div class="hero-buttons">
        <button class="btn-tonton"><i class="fa-solid fa-play"></i> Tonton</button>
        <button class="btn-detail"><i class="fa-solid fa-circle-info"></i> Detail</button>
      </div>
    </div>
  </section>

  <!-- Grid Film Populer -->
  <div class="section-header">
    <h2 class="section-title">Lagi Ramai Ditonton <span>Populer Minggu Ini</span></h2>
    <a href="#" class="see-all">Semua &gt;</a>
  </div>
  
  <main class="movie-grid" id="movie-container">
    <!-- Konten akan dirender oleh JavaScript dari API -->
  </main>

  <!-- Navigasi Bawah -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Cari</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-fire"></i>
      <span>Trending</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-bookmark"></i>
      <span>Simpan</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
