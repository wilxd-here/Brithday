<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 TT Downloader - No Watermark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 32px;
            padding: 40px 35px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 34, 0, 0.08);
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 4px;
        }
        h1 {
            text-align: center;
            color: #ff2200;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 28px;
            border-bottom: 1px solid #222;
            padding-bottom: 18px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 16px 18px;
            background: #0e0e0e;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
        }
        .input-group input:focus {
            border-color: #ff2200;
            box-shadow: 0 0 0 3px rgba(255, 34, 0, 0.12);
        }
        .input-group input::placeholder {
            color: #444;
        }
        .btn {
            padding: 16px 28px;
            background: #ff2200;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }
        .btn:hover {
            background: #cc1a00;
            box-shadow: 0 0 30px rgba(255, 34, 0, 0.25);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loading.show {
            display: block;
        }
        .loader {
            border: 3px solid #1e1e1e;
            border-top: 3px solid #ff2200;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            display: none;
            margin-top: 28px;
            background: #0e0e0e;
            border-radius: 20px;
            padding: 20px 22px;
            border: 1px solid #222;
        }
        .result.show {
            display: block;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caption {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
            max-height: 60px;
            overflow-y: auto;
        }
        .download-row {
            display: flex;
            gap: 10px;
        }
        .download-row .btn-download {
            flex: 1;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 14px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            transition: 0.25s;
            cursor: pointer;
        }
        .download-row .btn-download:hover {
            background: #2a2a2a;
            border-color: #ff2200;
        }
        .download-row .btn-download.primary {
            background: #ff2200;
            border-color: #ff2200;
        }
        .download-row .btn-download.primary:hover {
            background: #cc1a00;
        }
        .error-msg {
            background: #1f0a0a;
            border: 1px solid #4a1515;
            color: #ff6b6b;
            padding: 14px 18px;
            border-radius: 14px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #3a3a3a;
            font-size: 12px;
        }
        .footer span {
            color: #ff2200;
        }
        .api-info {
            background: #111;
            border-radius: 14px;
            padding: 10px 16px;
            margin-top: 18px;
            border: 1px solid #222;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
        .api-info strong {
            color: #aaa;
        }
        @media (max-width: 500px) {
            .container {
                padding: 24px 18px;
            }
            .input-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .download-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🎵</div>
        <h1>TT DOWNLOADER</h1>
        <p class="sub">No Watermark · Full HD · Gratis</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://www.tiktok.com/@user/video/123456789" />
            <button class="btn" id="downloadBtn" onclick="fetchVideo()">⬇️ Download</button>
        </div>

        <div class="loading" id="loading">
            <div class="loader"></div>
            <p style="color:#888; font-size:14px;">🔥 Inferno Nero sedang mengunduh...</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="result" id="result">
            <div class="video-wrapper" id="videoWrapper">
                <video id="videoPlayer" controls></video>
            </div>
            <div class="caption" id="caption">🎬 Judul video akan muncul di sini...</div>
            <div class="download-row">
                <a class="btn-download primary" id="downloadVideoBtn" download>⬇️ Download Video (No Watermark)</a>
            </div>
        </div>

        <div class="api-info">
            ⚡ Powered by <strong>Tikmate API</strong> · gratis tanpa batas
        </div>

        <div class="footer">
            <span>🔥</span> INFERNO NERO · API HITAM <span>🔥</span>
        </div>
    </div>

    <script>
        // ============================================
        // 🔥 INFERNO NERO - TT DOWNLOADER FINAL
        // PAKE DUA API BIAR AMAN!
        // ============================================

        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');
            const videoPlayer = document.getElementById('videoPlayer');
            const caption = document.getElementById('caption');
            const downloadBtn = document.getElementById('downloadVideoBtn');

            // Validasi
            if (!url) {
                showError('🔥 Masukkan link TikTok dulu!');
                return;
            }
            if (!url.includes('tiktok.com')) {
                showError('🔥 Itu bukan link TikTok yang valid!');
                return;
            }

            // UI state
            btn.disabled = true;
            btn.textContent = '⏳ PROSES...';
            loading.classList.add('show');
            result.classList.remove('show');
            errorMsg.classList.remove('show');

            try {
                // ============================================
                // API 1: Tikmate (Paling Stabil)
                // ============================================
                let data = await fetchTikmate(url);

                // Kalo gagal, coba API 2
                if (!data || !data.url) {
                    data = await fetchSSSTikTok(url);
                }

                // Kalo masih gagal, error
                if (!data || !data.url) {
                    throw new Error('Gagal mendapatkan video dari semua API.');
                }

                // Tampilkan hasil
                const videoUrl = data.url || data.video_url;
                const title = data.title || data.caption || '🎬 TikTok Video';
                const author = data.author || data.username || '';

                videoPlayer.src = videoUrl;
                videoPlayer.load();

                let captionText = title;
                if (author) captionText += ` — @${author}`;
                caption.textContent = captionText;

                downloadBtn.href = videoUrl;

                result.classList.add('show');

            } catch (err) {
                console.error('Error:', err);
                showError('🔥 Gagal mengunduh: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '⬇️ Download';
                loading.classList.remove('show');
            }
        }

        // ============================================
        // API 1: Tikmate
        // ============================================
        async function fetchTikmate(url) {
            try {
                const response = await fetch('https://api.tikmate.app/api/lookup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                if (!response.ok) return null;
                const data = await response.json();
                if (data && data.url) {
                    return {
                        url: data.url,
                        title: data.title || data.desc || '',
                        author: data.author || ''
                    };
                }
                return null;
            } catch {
                return null;
            }
        }

        // ============================================
        // API 2: SSSTikTok (via CORS Proxy)
        // ============================================
        async function fetchSSSTikTok(url) {
            try {
                const response = await fetch('https://api.allorigins.win/raw?url=' +
                    encodeURIComponent('https://ssstik.io/abc?url=' + url));
                if (!response.ok) return null;
                const text = await response.text();
                // Parse HTML sederhana
                const match = text.match(/https:\/\/[^"']+\.mp4/);
                if (match) {
                    return {
                        url: match[0],
                        title: 'TikTok Video',
                        author: ''
                    };
                }
                return null;
            } catch {
                return null;
            }
        }

        // ============================================
        // ERROR
        // ============================================
        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            document.getElementById('result').classList.remove('show');
            document.getElementById('loading').classList.remove('show');
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('downloadBtn').textContent = '⬇️ Download';
        }

        // ============================================
        // ENTER KEY
        // ============================================
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchVideo();
        });

        // ============================================
        // LOG
        // ============================================
        console.log('🔥 INFERNO NERO - TT DOWNLOADER FINAL!');
    </script>

</body>
</html>
